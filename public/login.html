<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | TaskNest</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: "#F8F5F2",
            sand: "#E9DDD4",
            coffee: "#6F4E37",
            mocha: "#8B6A54",
            ink: "#2E2A27"
          },
          fontFamily: {
            jakarta: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-cream font-jakarta text-ink min-h-screen">

  <main class="min-h-screen flex items-center justify-center px-6 py-12">

    <section class="w-full max-w-6xl bg-white rounded-[2rem] shadow-2xl overflow-hidden grid md:grid-cols-2">

      <div class="bg-sand p-10 md:p-14 flex flex-col justify-between">
        <div>
          <h1 class="text-4xl font-extrabold text-coffee">TaskNest</h1>
          <p class="mt-4 text-lg text-ink/70">
            Organize. Focus. Achieve.
          </p>
        </div>

        <div class="my-16">
          <h2 class="text-5xl font-extrabold leading-tight text-ink">
            Welcome back to your calm productivity space.
          </h2>

          <p class="mt-6 text-ink/60 leading-8">
            Sign in to manage your academic tasks, track deadlines, and stay focused.
          </p>
        </div>

        <p class="text-sm text-ink/50">
          Your tasks. Your progress. Your workspace.
        </p>
      </div>

      <div class="p-10 md:p-14">
        <h2 class="text-4xl font-extrabold text-coffee">Login</h2>
        <p class="mt-3 text-ink/60">
          Enter your account details to continue.
        </p>

        <form id="loginForm" class="mt-10 space-y-5">

          <div>
            <label class="font-bold text-sm">Email Address</label>
            <input
              id="loginEmail"
              type="email"
              required
              class="mt-2 w-full p-4 rounded-xl border border-coffee/10 outline-none focus:ring-2 focus:ring-coffee/30"
              placeholder="Enter your email"
            />
          </div>

          <div>
            <label class="font-bold text-sm">Password</label>
            <input
              id="loginPassword"
              type="password"
              required
              class="mt-2 w-full p-4 rounded-xl border border-coffee/10 outline-none focus:ring-2 focus:ring-coffee/30"
              placeholder="Enter your password"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-coffee text-white py-4 rounded-full font-extrabold hover:bg-mocha transition">
            Login
          </button>

        </form>

        <p class="mt-8 text-center text-ink/60">
          Don't have an account?
          <a href="signup.html" class="text-coffee font-extrabold hover:underline">
            Create Account
          </a>
        </p>
      </div>

    </section>

  </main>

  <div id="toast"></div>
  <script src="script.js"></script>

</body>
</html>
